[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shotstamp"
version = "1.0.0"
description = "Rename camera-roll photos by the date they were actually taken"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Krrish", email = "codewithkrrish7@gmail.com" }]
keywords = ["photos", "exif", "rename", "cli", "photography", "camera-roll"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]

[project.scripts]
shotstamp = "shotstamp.cli:run"

[project.urls]
Homepage = "https://github.com/codewithkrrish/shotstamp"

[tool.setuptools.packages.find]
include = ["shotstamp*"]
